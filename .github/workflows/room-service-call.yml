name: Room service call (two-way)
# FREE two-way conversational room-service caller (TextNow web).
# Listens to the front desk, transcribes with whisper.cpp (offline),
# and answers back with rule-based Chatty Porch replies.
#
# Browser (workflow_dispatch input browser, default 'firefox'):
#  - firefox: the PROVEN call path. Host checks #20 (fake-file) and
#    #22 (pipe) both PASSED with Firefox 159 — real audio both ways.
#  - chromium: DO NOT use for live calls. Runs #10-#16 proved the
#    Chromium-family encoder/decoder path yields silence at the remote
#    peer on this host (mic track carries audio, bytes flow, remote
#    decodes nothing). Firefox is the call browser.
#
# Mic modes (workflow_dispatch input mic_mode, default 'pipe'):
#  - pipe: live/dynamic mic (PulseAudio pipe-source or pw-loopback).
#    The ONLY mode that supports live replies during a call.
#  - fake-file: Chromium's built-in --use-file-for-fake-audio-capture.
#    The ORDER audio is the mic (one-shot, %noloop). Needs NO
#    PulseAudio. Live replies are NOT possible in this mode — the order
#    plays once and the call is listen-only after that. Use it when the
#    pipe mic will not flow audio on the runner.
#
# Triggers:
#   - workflow_dispatch: run now for one order. Inputs: order_id
#     (Firebase hailmary-orders-2way push ID), code (optional 6-digit
#     TextNow login code; otherwise polled from Firebase), dry_run.
#   - schedule: every 5 min, poll Firebase for a queued two-way order
#     and process it automatically (so tapping Auto-call on the order
#     page eventually places the call with no manual trigger).
# The order (items, room, guest, language) and the Chatty Porch order
# audio (orderAudioB64) live in Firebase node hailmary-orders-2way.
# The parent writes the order + audio there and, when the run reports
# waiting-for-code, reads Gmail and writes the 6-digit code to the order.
on:
  workflow_dispatch:
    inputs:
      order_id:
        description: 'Firebase hailmary-orders-2way push ID'
        required: false
        default: ''
      code:
        description: '6-digit TextNow login code (optional — otherwise polled from Firebase)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run only (verify host + loop, no live call)'
        type: boolean
        default: false
      mic_mode:
        description: 'Mic mode: pipe (live/dynamic, default) or fake-file (Chromium file-as-mic, one-shot order)'
        required: false
        default: 'pipe'
      browser:
        description: 'Browser: firefox (default — the proven call path; runs #20/#22 passed) or chromium (receive decodes silence on this host, do not use for live calls)'
        required: false
        default: 'firefox'
  schedule:
    - cron: '*/5 * * * *'
jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_NODE: hailmary-orders-2way
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system deps
        # The default Azure Ubuntu mirror (azure.archive.ubuntu.com) stalled
        # Nov 6 ~6:10 PM — apt-get update hung downloading cmake-data, and
        # two fresh runners hit the same wall. Switch to the main archive
        # mirror first (covers both sources.list and the DEB822
        # ubuntu.sources used by Ubuntu 24.04+), then update with retries.
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          grep -rh "URIs:" /etc/apt/sources.list.d/*.sources 2>/dev/null | head -3 || true
          for i in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 && break || { echo "apt-get update attempt $i failed — retrying in 10s"; sleep 10; }; done
          sudo apt-get install -y ffmpeg espeak-ng cmake build-essential pulseaudio xvfb pulseaudio-utils pipewire
      - name: Start audio (pipe-source or pw-loopback mic)
        # MIC_MODE=fake-file: SKIP all PulseAudio setup — Chromium's
        # --use-file-for-fake-audio-capture needs NO sound server at
        # all (the mic is a real WAV file). MIC_MODE=pipe: detect the
        # sound server FIRST (pactl info "Server Name"): real
        # PulseAudio vs PipeWire. Run #7 showed module-pipe-source
        # creates virtmic but it stays IDLE — PulseAudio never reads the
        # FIFO — which is what pipewire-pulse's partial module emulation
        # looks like. If the server is PipeWire, use the PipeWire-native
        # pw-loopback instead: it mirrors tts_sink into a REAL source
        # node named virtmic, fed by paplay into tts_sink. If it is real
        # PulseAudio, keep module-pipe-source (FIFO /tmp/virtmic).
        # MIC_FEED (pipe|paplay) is passed to Node via GITHUB_ENV.
        # Chromium output goes to spk_sink so it never feeds back into
        # the mic. (Scheduled runs have no inputs — mic_mode is empty,
        # so they default to pipe.)
        run: |
          if [ "${{ inputs.mic_mode }}" = "fake-file" ]; then
            echo "MIC_MODE=fake-file — no PulseAudio setup needed (Chromium file-as-mic)"
            echo "MIC_MODE=fake-file" >> "$GITHUB_ENV"
            exit 0
          fi
          pulseaudio --start --exit-idle-time=-1 || echo "pulseaudio --start failed (maybe PipeWire already running)"
          pactl info
          SERVER_NAME=$(pactl info | awk -F': ' '/^Server Name/{print $2}')
          echo "audio server: $SERVER_NAME"
          pactl load-module module-null-sink sink_name=spk_sink sink_properties=device.description=spk_sink
          pactl set-default-sink spk_sink
          if echo "$SERVER_NAME" | grep -qi pipewire; then
            echo "MIC_FEED=paplay" >> "$GITHUB_ENV"
            echo "PipeWire detected — pw-loopback virtmic (feed via paplay into tts_sink)"
            pactl load-module module-null-sink sink_name=tts_sink sink_properties=device.description=tts_sink
            nohup pw-loopback --capture-props='node.target=tts_sink' --playback-props='media.class=Audio/Source node.name=virtmic node.description=virtmic' > /tmp/pw-loopback.log 2>&1 &
            disown
            sleep 3
            cat /tmp/pw-loopback.log || true
            pactl set-default-source virtmic
          else
            echo "MIC_FEED=pipe" >> "$GITHUB_ENV"
            echo "PulseAudio detected — module-pipe-source virtmic (feed via /tmp/virtmic FIFO)"
            pactl load-module module-pipe-source source_name=virtmic file=/tmp/virtmic format=s16le rate=48000 channels=1
            pactl set-default-source virtmic
            ls -l /tmp/virtmic
          fi
          pactl list sinks short
          pactl list sources short
          pactl get-default-source
          pactl list sources short | grep -q virtmic || { echo "ERROR: virtmic source missing"; exit 1; }
      - name: Install Playwright + browser
        # Default browser is Firefox (host checks #20/#22 passed with
        # Firefox; Chromium-family runs decode silence at the remote
        # peer). Scheduled runs have no inputs, so an empty browser
        # input also means Firefox. BROWSER is passed to Node via
        # GITHUB_ENV so gha-call.js launches the right browser.
        run: |
          npm ci
          npx playwright install chromium --with-deps
          if [ "${{ inputs.browser }}" = "firefox" ] || [ -z "${{ inputs.browser }}" ]; then
            echo "browser=firefox — installing Playwright Firefox"
            npx playwright install firefox --with-deps
            echo "BROWSER=firefox" >> "$GITHUB_ENV"
          else
            echo "BROWSER=chromium" >> "$GITHUB_ENV"
          fi
      - name: Install whisper.cpp + tiny model
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build -j --target whisper-cli
          ./whisper.cpp/models/download-ggml-model.sh tiny.en
      - name: Resolve order id
        id: order
        run: |
          if [ -n "${{ inputs.order_id }}" ]; then
            echo "id=${{ inputs.order_id }}" >> "$GITHUB_OUTPUT"
          else
            ID=$(xvfb-run -a node poll-queued.js)
            if [ "$ID" = "NO_QUEUED_ORDER" ]; then ID=""; fi
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Run two-way call
        if: steps.order.outputs.id != '' || inputs.dry_run == true
        env:
          HAILMARY_LIVE: '1'
          PULSE_SOURCE: virtmic
          MIC_MODE: ${{ inputs.mic_mode || 'pipe' }}
          BROWSER: ${{ inputs.browser || 'firefox' }}
          WHISPER_BIN: ${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli
          WHISPER_MODEL: ${{ github.workspace }}/whisper.cpp/models/ggml-tiny.en.bin
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            if [ -n "${{ steps.order.outputs.id }}" ]; then
              xvfb-run -a node gha-call.js --order-id "${{ steps.order.outputs.id }}" --dry-run --result result.json
            else
              # No order id: verify the browser+mic loop against the sample
              # order (no TextNow, no dial). Order audio falls back to
              # espeak-ng — the loop is what's under test, not the voice.
              xvfb-run -a node gha-call.js --order sample-order.json --dry-run --result result.json
            fi
          else
            xvfb-run -a node gha-call.js --order-id "${{ steps.order.outputs.id }}" --live --code "${{ inputs.code }}" --result result.json
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-result-${{ steps.order.outputs.id }}
          path: result.json
          if-no-files-found: ignore
