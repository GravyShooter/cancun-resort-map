name: Room service call (two-way)
# FREE two-way conversational room-service caller (TextNow web).
# Listens to the front desk, transcribes with whisper.cpp (offline),
# and answers back with rule-based Chatty Porch replies.
#
# Triggers:
#   - workflow_dispatch: run now for one order. Inputs: order_id
#     (Firebase hailmary-orders-2way push ID), code (optional 6-digit
#     TextNow login code; otherwise polled from Firebase), dry_run.
#   - schedule: every 5 min, poll Firebase for a queued two-way order
#     and process it automatically (so tapping Auto-call on the order
#     page eventually places the call with no manual trigger).
# The order (items, room, guest, language) and the Chatty Porch order
# audio (orderAudioB64) live in Firebase node hailmary-orders-2way.
# The parent writes the order + audio there and, when the run reports
# waiting-for-code, reads Gmail and writes the 6-digit code to the order.
on:
  workflow_dispatch:
    inputs:
      order_id:
        description: 'Firebase hailmary-orders-2way push ID'
        required: false
        default: ''
      code:
        description: '6-digit TextNow login code (optional — otherwise polled from Firebase)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run only (verify host + loop, no live call)'
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_NODE: hailmary-orders-2way
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng cmake build-essential pulseaudio xvfb pulseaudio-utils pipewire
      - name: Start audio (pipe-source or pw-loopback mic)
        # Detect the sound server FIRST (pactl info "Server Name"):
        # real PulseAudio vs PipeWire. Run #7 showed module-pipe-source
        # creates virtmic but it stays IDLE — PulseAudio never reads the
        # FIFO — which is what pipewire-pulse's partial module emulation
        # looks like. If the server is PipeWire, use the PipeWire-native
        # pw-loopback instead: it mirrors tts_sink into a REAL source
        # node named virtmic, fed by paplay into tts_sink. If it is real
        # PulseAudio, keep module-pipe-source (FIFO /tmp/virtmic).
        # MIC_FEED (pipe|paplay) is passed to Node via GITHUB_ENV.
        # Chromium output goes to spk_sink so it never feeds back into
        # the mic.
        run: |
          pulseaudio --start --exit-idle-time=-1 || echo "pulseaudio --start failed (maybe PipeWire already running)"
          pactl info
          SERVER_NAME=$(pactl info | awk -F': ' '/^Server Name/{print $2}')
          echo "audio server: $SERVER_NAME"
          pactl load-module module-null-sink sink_name=spk_sink sink_properties=device.description=spk_sink
          pactl set-default-sink spk_sink
          if echo "$SERVER_NAME" | grep -qi pipewire; then
            echo "MIC_FEED=paplay" >> "$GITHUB_ENV"
            echo "PipeWire detected — pw-loopback virtmic (feed via paplay into tts_sink)"
            pactl load-module module-null-sink sink_name=tts_sink sink_properties=device.description=tts_sink
            nohup pw-loopback --capture-props='node.target=tts_sink' --playback-props='media.class=Audio/Source node.name=virtmic node.description=virtmic' > /tmp/pw-loopback.log 2>&1 &
            disown
            sleep 3
            cat /tmp/pw-loopback.log || true
            pactl set-default-source virtmic
          else
            echo "MIC_FEED=pipe" >> "$GITHUB_ENV"
            echo "PulseAudio detected — module-pipe-source virtmic (feed via /tmp/virtmic FIFO)"
            pactl load-module module-pipe-source source_name=virtmic file=/tmp/virtmic format=s16le rate=48000 channels=1
            pactl set-default-source virtmic
            ls -l /tmp/virtmic
          fi
          pactl list sinks short
          pactl list sources short
          pactl get-default-source
          pactl list sources short | grep -q virtmic || { echo "ERROR: virtmic source missing"; exit 1; }
      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Install whisper.cpp + tiny model
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build -j --target whisper-cli
          ./whisper.cpp/models/download-ggml-model.sh tiny.en
      - name: Resolve order id
        id: order
        run: |
          if [ -n "${{ inputs.order_id }}" ]; then
            echo "id=${{ inputs.order_id }}" >> "$GITHUB_OUTPUT"
          else
            ID=$(xvfb-run -a node poll-queued.js)
            if [ "$ID" = "NO_QUEUED_ORDER" ]; then ID=""; fi
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Run two-way call
        if: steps.order.outputs.id != '' || inputs.dry_run == true
        env:
          HAILMARY_LIVE: '1'
          PULSE_SOURCE: virtmic
          WHISPER_BIN: ${{ github.workspace }}/whisper.cpp/build/bin/whisper-cli
          WHISPER_MODEL: ${{ github.workspace }}/whisper.cpp/models/ggml-tiny.en.bin
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            xvfb-run -a node gha-call.js --order-id "${{ steps.order.outputs.id }}" --dry-run --result result.json
          else
            xvfb-run -a node gha-call.js --order-id "${{ steps.order.outputs.id }}" --live --code "${{ inputs.code }}" --result result.json
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-result-${{ steps.order.outputs.id }}
          path: result.json
          if-no-files-found: ignore
