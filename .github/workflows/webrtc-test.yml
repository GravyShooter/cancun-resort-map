name: WebRTC host test
# Verifies the GitHub Actions runner supports WebRTC media (UDP socket,
# TURN ICE, two-peer connection). Run this first, before the call workflow.
# Trigger: Actions tab -> Run workflow. No inputs needed.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Install virtual audio + display
        # PulseAudio provides the pipe-source mic (virtmic); xvfb-run
        # provides a display session for the audio stack.
        # ffmpeg is needed by the host check (tone generation + volume
        # measurement of the received audio).
        run: sudo apt-get update && sudo apt-get install -y pulseaudio xvfb pulseaudio-utils ffmpeg
      - name: Start PulseAudio (pipe-source mic)
        # NEW method: module-pipe-source creates a REAL source (virtmic)
        # fed live by the FIFO /tmp/virtmic. The module creates the FIFO
        # itself — do NOT mkfifo it. Node writes raw s16le 48kHz mono PCM
        # into the FIFO; Chromium opens virtmic as its mic. This replaces
        # the Vexa remap-source approach (Chromium refuses a .monitor as
        # a mic input). Chromium output goes to spk_sink so it never
        # feeds back into the mic. Do NOT use
        # --use-fake-device-for-media-stream (bypasses PulseAudio) or
        # --use-file-for-fake-audio-capture (forces silence as mic input).
        # Fail fast if the module does not load (PipeWire on ubuntu-24.04
        # only partially emulates pactl modules).
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=spk_sink sink_properties=device.description=spk_sink
          pactl load-module module-pipe-source source_name=virtmic file=/tmp/virtmic format=s16le rate=48000 channels=1
          pactl set-default-sink spk_sink
          pactl set-default-source virtmic
          pactl list sinks short
          pactl list sources short
          pactl get-default-source
          pactl list sources short | grep -q virtmic || { echo "ERROR: virtmic source missing (module-pipe-source did not load)"; exit 1; }
          ls -l /tmp/virtmic
      - name: Run WebRTC host check
        env:
          PULSE_SOURCE: virtmic
        run: xvfb-run -a node test-host.js
