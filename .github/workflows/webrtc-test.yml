name: WebRTC host test
# Verifies the GitHub Actions runner supports WebRTC media (UDP socket,
# TURN ICE, two-peer connection). Run this first, before the call workflow.
# Trigger: Actions tab -> Run workflow. No inputs needed.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Install virtual audio + display
        # PulseAudio provides the Vexa virtual mic (tts_sink + remap
        # source); xvfb-run provides a display session for the audio stack.
        # ffmpeg is needed by the host check (tone generation + volume
        # measurement of the received audio).
        run: sudo apt-get update && sudo apt-get install -y pulseaudio xvfb pulseaudio-utils ffmpeg
      - name: Start PulseAudio (Vexa virtual mic)
        # Vexa pattern: TTS audio plays into tts_sink; virtual_mic is a
        # remap source of tts_sink.monitor and is Chromium's mic.
        # Chromium output goes to spk_sink so it never feeds back into
        # the mic. Do NOT use --use-fake-device-for-media-stream (it
        # bypasses PulseAudio) or --use-file-for-fake-audio-capture
        # (forces silence as mic input).
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tts_sink sink_properties=device.description=tts_sink
          pactl load-module module-null-sink sink_name=spk_sink sink_properties=device.description=spk_sink
          pactl load-module module-remap-source master=tts_sink.monitor source_name=virtual_mic source_properties=device.description=virtual_mic
          pactl set-default-sink spk_sink
          pactl set-default-source virtual_mic
          pactl list sinks short
          pactl list sources short
      - name: Run WebRTC host check
        run: xvfb-run -a node test-host.js
